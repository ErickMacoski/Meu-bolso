<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Bolso</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <div>
        <h1>Meu Bolso</h1>
        <p>Seu dinheiro, mais organizado.</p>
      </div>
      <div class="month-box">
        <label for="monthFilter">Mês de referência</label>
        <input type="month" id="monthFilter" />
      </div>
    </div>
  </header>

  <main class="container">
    <section class="dashboard">
      <div class="card income">
        <h2>Receitas</h2>
        <p id="totalIncome">R$ 0,00</p>
      </div>

      <div class="card expense">
        <h2>Despesas</h2>
        <p id="totalExpense">R$ 0,00</p>
      </div>

      <div class="card balance" id="balanceCard">
        <h2>Saldo do mês</h2>
        <p id="totalBalance">R$ 0,00</p>
      </div>
    </section>

    <section class="content-grid">
      <article class="panel">
        <h2>Nova movimentação</h2>

        <form id="transactionForm">
          <div class="form-group">
            <label for="description">Descrição</label>
            <input type="text" id="description" placeholder="Ex.: Mercado" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="type">Tipo</label>
              <select id="type" required>
                <option value="despesa">Despesa</option>
                <option value="receita">Receita</option>
              </select>
            </div>

            <div class="form-group">
              <label for="value">Valor (R$)</label>
              <input type="number" id="value" step="0.01" min="0.01" placeholder="0,00" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="category">Categoria</label>
              <select id="category" required>
                <option value="Alimentação">Alimentação</option>
                <option value="Moradia">Moradia</option>
                <option value="Transporte">Transporte</option>
                <option value="Educação">Educação</option>
                <option value="Lazer">Lazer</option>
                <option value="Saúde">Saúde</option>
                <option value="Salário">Salário</option>
                <option value="Outros">Outros</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">Data</label>
              <input type="date" id="date" required />
            </div>
          </div>

          <button type="submit" class="btn">+ Adicionar movimentação</button>
          <p class="message" id="formMessage"></p>
        </form>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Histórico do mês</h2>
          <span id="transactionCount">0 registros</span>
        </div>

        <div id="transactionList" class="transaction-list">
          <p class="empty-state">Nenhuma movimentação neste mês. Adicione a primeira!</p>
        </div>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
